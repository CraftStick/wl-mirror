name: mirror
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: fetch and publish
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          curl -fsS -m 30 -o wl https://hub.mos.ru/rkp/sub-roskompozor/raw/main/wl
          test "$(grep -c '://' wl)" -ge 5
          jq -Rs '{files:{wl:{content:.}}}' wl | curl -fsS -X PATCH \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" -d @- > /dev/null
