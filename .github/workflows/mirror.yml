name: mirror
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: check gist freshness
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          # Список РКП в гист кладёт не этот репозиторий, а таймер wl-mirror-rkp на машине в РФ:
          # с 20.10.2026 hub.mos.ru отвечает 403 на каждый запрос раннеров GitHub. Здесь осталась
          # только сигнализация — красный прогон, когда копия в гисте старше 12 ч. Тогда либо
          # источник умер (и решать, держать ли его в .env бота, — человеку), либо встал таймер
          # или истёк его токен: смотреть `systemctl status wl-mirror-rkp` и `journalctl -u wl-mirror-rkp`.
          # Возраст — у гиста целиком (updated_at); пока файл в нём один, это его возраст.
          # Таймер выкладывает только изменившийся список, а РКП коммитит примерно раз в час,
          # так что 12 ч без обновления — уже не случайность.
          set -o pipefail
          max_stale_hours=12
          updated=$(curl -fsS -m 30 --retry 4 --retry-delay 15 --retry-all-errors \
            -H "Authorization: Bearer $GIST_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" | jq -er .updated_at)
          age=$(( ($(date +%s) - $(date -d "$updated" +%s)) / 3600 ))
          if [ "$age" -ge "$max_stale_hours" ]; then
            echo "::error::wl: gist copy is ${age}h old (updated $updated)"; exit 1
          fi
          echo "wl: gist updated $updated (${age}h ago)"
